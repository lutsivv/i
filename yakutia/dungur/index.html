<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шаманский бубен</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #061224;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 150, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 200, 0.1) 0%, transparent 40%),
                linear-gradient(135deg, #061224 0%, #0a1c3a 100%);
            color: #e0f0ff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(0, 200, 255, 0.03) 40px, rgba(0, 200, 255, 0.03) 41px),
                repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(0, 200, 255, 0.03) 40px, rgba(0, 200, 255, 0.03) 41px);
            pointer-events: none;
            z-index: 0;
        }

        .center-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(100, 200, 255, 0.6);
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #88bbdd;
            font-size: 15px;
            letter-spacing: 1px;
            margin-bottom: 40px;
        }

        .shaman-drum {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 50%, #8b5a2b 0%, #4a2e1b 80%, #2a160a 100%);
            border: 10px solid #1c0e05;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.8), 
                0 0 30px rgba(0, 200, 255, 0.3),
                inset 0 0 20px rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
            position: relative;
        }

        .drum-skin {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, #fdf4d8 0%, #e8d4b0 40%, #c4a57b 80%, #8c6a4c 100%);
            box-shadow: 
                inset 0 0 30px rgba(0,0,0,0.6),
                0 0 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .drum-art {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .drum-art .center-symbol {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: rgba(74, 46, 27, 0.6);
            text-shadow: 0 0 5px rgba(0,0,0,0.2);
        }

        .drum-art .rune {
            position: absolute;
            font-size: 20px;
            font-weight: 900;
            color: rgba(74, 46, 27, 0.5);
            font-family: serif;
        }
        .rune-1 { top: 15%; left: 20%; }
        .rune-2 { top: 15%; right: 20%; }
        .rune-3 { bottom: 15%; left: 20%; }
        .rune-4 { bottom: 15%; right: 20%; }

        .drum-text {
            position: absolute;
            bottom: 20px;
            font-size: 12px;
            font-weight: 900;
            color: rgba(74, 46, 27, 0.8);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .shaman-drum.hit {
            transform: scale(0.93);
            box-shadow: 
                0 0 80px rgba(0, 212, 255, 1), 
                0 0 20px rgba(255, 255, 255, 0.5),
                inset 0 0 40px rgba(0,0,0,0.9);
        }

        .drum-hint {
            color: #88bbdd;
            font-size: 14px;
            margin-top: 30px;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="center-container">
        <h1>Дюнгюр</h1>
        <p class="subtitle">Шаманский бубен</p>

        <div class="shaman-drum" id="drumButton">
            <div class="drum-skin">
                <div class="drum-art">
                    <div class="center-symbol">☯</div>
                    <div class="rune rune-1">ᚱ</div>
                    <div class="rune rune-2">ᚢ</div>
                    <div class="rune rune-3">ᚾ</div>
                    <div class="rune rune-4">ᛗ</div>
                    <div class="drum-text">Ударить</div>
                </div>
            </div>
        </div>

        <p class="drum-hint">Нажми на бубен, чтобы услышать звук дюнгюра</p>
    </div>

    <audio id="drumSound" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_fe43c611b0.mp3?filename=freesound_community-buben1-47792.mp3" preload="auto"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const drum = document.getElementById('drumButton');
            const sound = document.getElementById('drumSound');

            if (drum && sound) {
                drum.addEventListener('click', () => {
                    sound.currentTime = 0;
                    sound.play().catch(e => console.log('Ошибка:', e));

                    drum.classList.add('hit');
                    setTimeout(() => {
                        drum.classList.remove('hit');
                    }, 150);
                });
            }
        });
    </script>

</body>
</html>
