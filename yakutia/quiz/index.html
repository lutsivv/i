<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Викторина — Якутия</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap');
*{box-sizing:border-box}

body{
    margin:0;
    padding:20px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background-color:#061224;
    background-image:
        radial-gradient(circle at 20% 20%, rgba(0, 200, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 200, 0.1) 0%, transparent 40%),
        linear-gradient(135deg, #061224 0%, #0a1c3a 100%);
    color:#e0f0ff;
    font-family:'Montserrat',sans-serif;
    position:relative;
    overflow-x:hidden;
}

body::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;bottom:0;
    background-image:
        repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(0,200,255,0.03) 40px, rgba(0,200,255,0.03) 41px),
        repeating-linear-gradient(-45deg, transparent, transparent 40px, rgba(0,200,255,0.03) 40px, rgba(0,200,255,0.03) 41px);
    pointer-events:none;
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:700px;
    padding:35px;
    background:rgba(10,25,47,0.85);
    backdrop-filter:blur(10px);
    border:1px solid rgba(100,200,255,0.3);
    border-radius:24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,200,255,0.05);
}

h1{
    color:#fff;
    text-align:center;
    font-size:26px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:2px;
    text-shadow:0 0 15px rgba(100,200,255,0.6);
    margin-bottom:10px;
}

.subtitle{
    color:#88bbdd;
    text-align:center;
    font-size:15px;
    letter-spacing:1px;
    margin-bottom:25px;
}

#startScreen, #quizScreen, #resultScreen { display: none; }
#startScreen.active, #quizScreen.active, #resultScreen.active { display: block; }

.btn-start{
    background:linear-gradient(135deg, #0077ff, #00d4ff);
    color:#fff;
    border:none;
    padding:16px 45px;
    border-radius:12px;
    font-weight:900;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
    margin-top:25px;
    box-shadow:0 0 20px rgba(0,150,255,0.5);
    text-transform:uppercase;
    letter-spacing:1px;
    width: 100%;
}
.btn-start:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(0,200,255,0.8)}

.player-name-input{
    width:100%;
    padding:14px;
    background:rgba(0,0,0,0.4);
    border:1px solid rgba(100,200,255,0.3);
    border-radius:8px;
    color:#fff;
    font-family:inherit;
    font-size:18px;
    outline:none;
    margin-bottom:15px;
    text-align:center;
    transition:0.2s;
}
.player-name-input:focus{border-color:#00d4ff;box-shadow:0 0 10px rgba(0,212,255,0.2)}

.question-text{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
    line-height:1.4;
    text-align:left;
    color:#fff;
}

.options{display:flex;flex-direction:column;gap:12px}

.option-btn{
    background:rgba(0,50,100,0.4);
    border:1px solid rgba(100,200,255,0.3);
    color:#e0f0ff;
    padding:16px;
    border-radius:10px;
    font-size:16px;
    text-align:left;
    cursor:pointer;
    transition:0.2s;
    font-family:inherit;
}
.option-btn:hover:not(:disabled){background:rgba(0,100,200,0.6);border-color:#00d4ff;transform:translateX(5px)}
.option-btn:disabled{cursor:not-allowed;transform:none}

/* Правильный и неправильный ответ */
.option-btn.correct{
    background: rgba(0, 255, 100, 0.2);
    border-color: #00ff88;
    color: #00ff88;
    font-weight: bold;
}
.option-btn.wrong{
    background: rgba(255, 51, 51, 0.2);
    border-color: #ff3333;
    color: #ff3333;
    font-weight: bold;
}

/* Блок со справкой (УВЕЛИЧЕН ШРИФТ) */
.explanation-box {
    margin-top: 20px;
    padding: 18px;
    background: rgba(0, 0, 0, 0.4);
    border-left: 4px solid #00d4ff;
    border-radius: 8px;
    color: #b0d0ff; /* Чуть светлее для контраста */
    font-size: 18px; /* Было 14px, стало 18px */
    line-height: 1.6;
    display: none;
    text-align: left;
}

/* Кнопка "Следующий вопрос" */
.btn-next {
    background: linear-gradient(135deg, #0077ff, #00d4ff);
    color: #fff;
    border: none;
    padding: 15px 30px;
    border-radius: 10px;
    font-weight: 900;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    width: 100%;
    display: none;
    text-transform: uppercase;
    transition: 0.2s;
}
.btn-next:hover { transform: scale(1.02); }

/* Экран результатов */
#resultScreen { text-align: center; }
.score-big {
    font-size: 60px;
    font-weight: 900;
    color: #00d4ff;
    text-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
    margin: 20px 0;
}
.rank-title {
    font-size: 22px;
    font-weight: 900;
    color: #00ff88;
    margin-bottom: 10px;
}
.rank-desc {
    font-size: 16px;
    color: #88bbdd;
    line-height: 1.5;
    margin-bottom: 30px;
}

@media(max-width:480px){
    .container{padding:18px}
    h1{font-size:21px}
    .question-text{font-size:18px}
    .explanation-box { font-size: 16px; } /* На телефонах чуть меньше, чтобы влезало */
}
</style>
</head>
<body>
<div class="container">
  
  <!-- ЭКРАН 1: СТАРТ -->
  <section id="startScreen" class="active">
    <h1>Викторина: Якутия</h1>
    <p class="subtitle">Пройди викторину и проверь свои знания о Якутии!</p>
    <input id="playerNameInput" class="player-name-input" maxlength="40" placeholder="Введи свое имя" autocomplete="nickname">
    <button class="btn-start" onclick="startQuiz()">Начать</button>
  </section>
  
  <!-- ЭКРАН 2: ВИКТОРИНА -->
  <section id="quizScreen">
    <div class="question-text" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="explanation-box" id="explanationBox"></div>
    <button class="btn-next" id="nextButton" onclick="nextQuestion()">Следующий вопрос</button>
  </section>
  
  <!-- ЭКРАН 3: РЕЗУЛЬТАТ -->
  <section id="resultScreen">
    <h1>Результат игры</h1>
    <div class="score-big" id="finalScore">0%</div>
    <div class="rank-title" id="rankTitle"></div>
    <div class="rank-desc" id="rankDesc"></div>
    <button class="btn-start" onclick="location.reload()">Пройти еще раз</button>
  </section>

</div>

<script>
// Вопросы из ТЗ мамы (ровно 10 штук)
const questions = [
    {
        q: "1. Как ещё называют Якутию?",
        o: ["А) Республика Бурятия", "Б) Республика Саха"],
        a: 1,
        e: "«Саха» — это самоназвание якутского народа. Официальное название региона — Республика Саха (Якутия). Название «Якутия» чаще используют в быту, а «Саха» подчёркивает национальную идентичность."
    },
    {
        q: "2. Какая река — одна из крупнейших в Якутии и одна из самых длинных в мире?",
        o: ["А) Волга", "Б) Лена"],
        a: 1,
        e: "Река Лена тянется более чем на 4 400 км и впадает в море Лаптевых. В её дельте находится уникальный природный объект — Ленские столбы, которые включены в список Всемирного наследия ЮНЕСКО."
    },
    {
        q: "3. Что такое «вечная мерзлота»?",
        o: ["А) Лёд, который никогда не тает даже летом", "Б) Почва, которая остаётся замёрзшей на глубине много лет подряд"],
        a: 1,
        e: "В Якутии вечная мерзлота может уходить вглубь на сотни метров. Из-за неё дома строят на сваях, чтобы тепло от здания не растапливало грунт и фундамент не «поплыл»."
    },
    {
        q: "4. Какой город — столица Якутии?",
        o: ["А) Иркутск", "Б) Якутск"],
        a: 1,
        e: "Якутск — крупнейший город в зоне вечной мерзлоты. Зимой температура здесь может опускаться ниже −40 °C, а летом бывают тёплые дни до +30 °C. Такой резкий перепад — одна из особенностей якутского климата."
    },
    {
        q: "5. Какое животное часто изображают на сувенирах из Якутии и считают символом силы и выносливости?",
        o: ["А) Северный олень", "Б) Мамонт"],
        a: 1,
        e: "На территории Якутии находят одни из самых хорошо сохранившихся останков мамонтов в мире. Например, знаменитый мамонтёнок Дима был найден в бассейне реки Колымы."
    },
    {
        q: "6. Что такое Ысыах?",
        o: ["А) Национальный праздник, посвящённый встрече лета и солнца", "Б) Название якутской национальной одежды"],
        a: 0,
        e: "Ысыах отмечают в июне, когда дни самые длинные. На празднике проводят обряды, угощают гостей, устраивают спортивные состязания и танцуют осуохай — круговой танец, символизирующий единство и круговорот жизни."
    },
    {
        q: "7. Какой традиционный напиток делают из кобыльего молока?",
        o: ["А) Кумыс", "Б) Айран"],
        a: 0,
        e: "Кумыс — древний напиток кочевников, который ценится за питательные свойства. В Якутии его иногда подают на национальных праздниках, например, на Ысыахе — главном летнем празднике встречи солнца."
    },
    {
        q: "8. Какой минерал добывают в Якутии и который известен во всём мире?",
        o: ["А) Изумруд", "Б) Алмаз"],
        a: 1,
        e: "Якутия — один из мировых лидеров по добыче алмазов. Здесь находится знаменитый карьер «Мир» — огромная воронка глубиной более 500 метров, которую видно даже из космоса."
    },
    {
        q: "9. Как называется традиционное жилище якутов, которое хорошо сохраняет тепло в мороз?",
        o: ["А) Юрта", "Б) Балаган"],
        a: 1,
        e: "Балаган — это зимнее жилище из брёвен, обмазанных глиной и мхом для лучшей теплоизоляции. Его форма и материалы помогали людям выживать в суровых условиях якутской зимы."
    },
    {
        q: "10. Какая природная зона преобладает в Якутии?",
        o: ["А) Степь", "Б) Тайга и тундра"],
        a: 1,
        e: "Большая часть Якутии покрыта тайгой — хвойными лесами, а северные районы — тундрой. Из-за сурового климата растительность здесь особенная: деревья растут медленно, а многие растения приспособились к короткому лету и долгой зиме."
    }
];

let currentIndex = 0;
let score = 0;
let answered = false;

function startQuiz() {
    const name = document.getElementById('playerNameInput').value.trim();
    if (!name) {
        alert('Пожалуйста, введи свое имя!');
        return;
    }
    
    document.getElementById('startScreen').classList.remove('active');
    document.getElementById('quizScreen').classList.add('active');
    
    currentIndex = 0;
    score = 0;
    showQuestion();
}

function showQuestion() {
    if (currentIndex >= questions.length) {
        showResult();
        return;
    }
    
    answered = false;
    const q = questions[currentIndex];
    
    document.getElementById('questionText').textContent = q.q;
    
    const optionsContainer = document.getElementById('optionsContainer');
    optionsContainer.innerHTML = '';
    
    q.o.forEach((option, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = option;
        btn.onclick = () => checkAnswer(index, btn);
        optionsContainer.appendChild(btn);
    });
    
    document.getElementById('explanationBox').style.display = 'none';
    document.getElementById('nextButton').style.display = 'none';
    
    // Меняем текст кнопки на последнем вопросе
    const nextBtn = document.getElementById('nextButton');
    if (currentIndex === questions.length - 1) {
        nextBtn.textContent = 'Посмотреть свой уровень знания Якутии';
    } else {
        nextBtn.textContent = 'Следующий вопрос';
    }
}

function checkAnswer(selectedIndex, btn) {
    if (answered) return;
    answered = true;
    
    const q = questions[currentIndex];
    const buttons = document.querySelectorAll('.option-btn');
    
    // Отключаем все кнопки
    buttons.forEach(b => b.disabled = true);
    
    // Подсвечиваем правильный и неправильный
    if (selectedIndex === q.a) {
        btn.classList.add('correct');
        score += 10; // 1 правильный ответ = 10%
    } else {
        btn.classList.add('wrong');
        buttons[q.a].classList.add('correct'); // Показываем правильный
    }
    
    // Показываем справку
    const expBox = document.getElementById('explanationBox');
    expBox.textContent = 'Справка: ' + q.e;
    expBox.style.display = 'block';
    
    // Показываем кнопку "Следующий вопрос"
    document.getElementById('nextButton').style.display = 'block';
}

function nextQuestion() {
    currentIndex++;
    showQuestion();
}

function showResult() {
    document.getElementById('quizScreen').classList.remove('active');
    document.getElementById('resultScreen').classList.add('active');
    
    document.getElementById('finalScore').textContent = score + '%';
    
    // Определяем звание по ТЗ мамы
    let title = '';
    let desc = '';
    
    switch(score) {
        case 10:
            title = 'Начинающий исследователь Якутии';
            desc = 'Только делает первые шаги и открывает для себя удивительный северный край.';
            break;
        case 20:
            title = 'Любознательный путешественник по земле Саха';
            desc = 'Уже замечает интересные детали и с интересом смотрит по сторонам.';
            break;
        case 30:
            title = 'Юный следопыт долины Туймаады';
            desc = 'Умеет подмечать приметы и складывать кусочки знаний в общую картину.';
            break;
        case 40:
            title = 'Внимательный наблюдатель природы Якутии';
            desc = 'Замечает, как устроена жизнь среди вечной мерзлоты и северных ветров.';
            break;
        case 50:
            title = 'Уверенный знаток основ Якутии';
            desc = 'Хорошо ориентируется в главных фактах и готов идти дальше.';
            break;
        case 60:
            title = 'Твёрдый знаток земли якутов';
            desc = 'Уверенно рассказывает про реки, климат и традиции, не путает детали.';
            break;
        case 70:
            title = 'Уверенный знаток земли якутов';
            desc = 'Знания становятся глубже: легко связывает историю, природу и быт.';
            break;
        case 80:
            title = 'Опытный проводник по Якутии';
            desc = 'Может сам вести экскурсию по самым интересным фактам и местам.';
            break;
        case 90:
            title = 'Почти хранитель якутских знаний';
            desc = 'Осталось совсем немного — и можно рассказывать легенды и факты как настоящий краевед.';
            break;
        case 100:
            title = 'Хранитель знаний о Якутии';
            desc = 'Тот, кто собрал всю мозаику воедино и теперь бережно хранит эти знания.';
            break;
        default:
            title = 'Начинающий исследователь Якутии';
            desc = 'Только делает первые шаги и открывает для себя удивительный северный край.';
    }
    
    document.getElementById('rankTitle').textContent = title;
    document.getElementById('rankDesc').textContent = desc;
}
</script>
</body>
</html>
